<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <title>Memory Graveyard</title>
  </head>
  <body>
    <main id="shell">
      <canvas id="game" aria-label="Memory Graveyard game canvas"></canvas>

      <div id="analog-fx" class="analog-fx" aria-hidden="true"></div>

      <div id="hud">
        <header class="brand">
          <h1>MEMORY GRAVEYARD</h1>
          <p>the forest remembers you</p>
        </header>

        <div id="toast" class="toast" role="status"></div>
        <aside class="controls" aria-label="Controls">
          <div><kbd>W</kbd><kbd>SPACE</kbd> jump</div>
          <div><kbd>R</kbd> restart run</div>
        </aside>
      </div>

      <div id="stamina-ui" class="stamina-ui" aria-hidden="true">
        <img class="stamina-icon" src="assets/ui/bolt-green.png" alt="" />
        <span class="stamina-label">Stamina</span>
        <div class="stamina-track">
          <div id="stamina-fill" class="stamina-fill" data-level="high"></div>
        </div>
      </div>

      <div id="run-score" class="run-score" aria-hidden="true">
        <div class="run-score-row">
          <img class="score-icon" src="assets/ui/coin.png" alt="" />
          <span>Score</span>
          <strong id="run-score-value">000000</strong>
        </div>
        <div class="run-score-row run-score-best">
          <img class="score-icon" src="assets/ui/coin.png" alt="" />
          <span>Best</span>
          <strong id="run-best-value">000000</strong>
        </div>
      </div>

      <div id="menu-ui" class="menu-ui"></div>
      <div id="run-ui" class="run-ui"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
