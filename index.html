<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b10" />
    <title>Memory Graveyard</title>
  </head>
  <body>
    <main id="shell">
      <canvas id="game" aria-label="Memory Graveyard game canvas"></canvas>

      <div id="hud">
        <header class="brand">
          <h1>MEMORY GRAVEYARD</h1>
          <p>collect what the dead left behind</p>
        </header>

        <section class="panel" aria-label="Progress">
          <div class="row">
            <span class="label">MEMORIES</span>
            <span id="collected" class="value">0 / 0</span>
          </div>
          <div class="row">
            <span class="label">TITLE</span>
            <span id="rank" class="value accent">WANDERER</span>
          </div>
        </section>

        <div id="toast" class="toast" role="status"></div>

        <aside class="controls" aria-label="Controls">
          <div><kbd>A</kbd><kbd>D</kbd> move</div>
          <div><kbd>SPACE</kbd> jump</div>
          <div><kbd>S</kbd>+<kbd>SPACE</kbd> drop through</div>
          <div><kbd>R</kbd> reset</div>
        </aside>

        <button id="open-editor" class="mode-button" hidden>Open editor</button>
      </div>

      <div id="editor-ui" class="editor-ui"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
